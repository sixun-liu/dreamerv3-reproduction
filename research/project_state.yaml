canonical_baseline:
  id: DV3-2026-DMCP-WALKER-KL-CONTROL
  name: DreamerV3 2026 runtime seeded walker_walk KL control
  repo_commit: 5b49eebf12126352bce25867cbe99acde620b035
  config: runtime ad49802; size12m; ratio512; repeat2; 16 envs; 250K agent decisions=500K environment steps; env.dmc.use_seed=True; free_nats=1; dyn=1; rep=0.1
  evaluation_protocol: 对每个arm使用agent/env seeds 0和1配对；训练score按environment steps分箱，报告0-250K与250-500K AUC及final-30K；同时比较raw KL、KL阈值比例、prior/posterior entropy与reconstruction losses；终点checkpoint做固定eval seed10000的随机连续策略评估并与训练口径分列。
parked_lanes:
- Figure 18完整3x14任务论文消融矩阵
- EXP-0007之后的访问分布匹配机制归因
- Crafter scaling与DMC visual/full suite
- 旧runtime早期曲线谱系归因
- E2-E5横向机制扩展
stage_exit_gates:
- Figure 18两种梯度阻断已绑定论文原文、代码路径与等价性边界。
- 单batch参数组grad-norm known-answer test可区分representation与head/decoder梯度路由。
- 任务、预算、seed政策、聚合口径和conceptual证据权限经用户确认后才创建下一实验。
