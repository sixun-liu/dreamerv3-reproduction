schema_version: 1
domain: minecraft
primary_metrics:
- 各里程碑成功回合数、首次出现environment step和回报分布
tail_metrics:
- NaN/Inf、环境错误、checkpoint/replay完整性、吞吐、资源峰值和视频动态性
forbidden_inputs:
- 不按中途分数换seed、模型、ratio、reward、动作、break speed或预算。
- 100K后不自动追加1M/5M/100M；不把L0或早期里程碑称为论文钻石数值复现。
promotion_gates:
- L0与size50m资源门通过，100K自然完成且checkpoint/replay/metrics/里程碑分析/独立评测/视频完整。
review_requirements:
- 人工审查L0首帧、正式曲线和固定评测第0局视频。
